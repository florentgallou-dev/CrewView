<svg xmlns="http://www.w3.org/2000/svg" viewBox="-64 0 192 64" width="192" height="64">
  <!-- Motif du sol : 2 × 2 dalles, répété sur toute la salle. Ancre (0,0) : coin arrière du motif. -->
  <polygon points="0,0 32,16 0,32 -32,16" fill="#f3f4f6" stroke="#e1e4e8" stroke-width="0.75"/>
  <polygon points="-32,16 0,32 -32,48 -64,32" fill="#eef0f2" stroke="#e1e4e8" stroke-width="0.75"/>
  <polygon points="32,16 64,32 32,48 0,32" fill="#eef0f2" stroke="#e1e4e8" stroke-width="0.75"/>
  <polygon points="0,32 32,48 0,64 -32,48" fill="#f3f4f6" stroke="#e1e4e8" stroke-width="0.75"/>
</svg>
